<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="assets/imgs/Logo.png" type="image/png">
    <title>Plan</title>
</head>

<body class="bg-gray-50 text-gray-600">

    <main class="container mx-auto px-4 my-4">

        <div>

            <ul class="grid md:grid-cols-3 gap-4">
                <li class="rounded-xl bg-white shadow justify-self-end min-w-xs p-4">
                    <div class="flex justify-between items-center">
                        <label for="basic"
                            class="bg-yellow-100 text-yellow-800 font-semibold py-2 px-3 rounded-xl">Basic</label>
                        <input type="radio" name="plan" id="basic"
                            class="w-4 h-4 rounded-full border checked:bg-yellow-800 appearance-none">
                    </div>

                    <div class="mt-6 mb-4">
                        <div class="text-lg">
                            <b class="font-bold text-4xl text-gray-800">10</b> <span>Credits</span>
                        </div>

                        <div class="my-4 text-lg">
                            <b class="font-bold text-2xl text-gray-800">$5</b> <span>/month</span>
                        </div>
                    </div>
                </li>

                <li class="rounded-xl bg-white border border-purple-700 shadow p-4">
                    <div class="flex justify-between items-center">
                        <label for="economy"
                            class="bg-purple-100 text-purple-800 font-semibold py-2 px-3 rounded-xl">Economy</label>
                        <input type="radio" name="plan" id="economy"
                            class="w-4 h-4 rounded-full border checked:bg-purple-800 appearance-none" checked>

                    </div>

                    <div class="mt-6 mb-4">
                        <div class="text-lg">
                            <b class="font-bold text-4xl text-gray-800">50</b> <span>Credits</span>
                        </div>

                        <div class="my-4 text-lg">
                            <b class="font-bold text-2xl text-gray-800">$10</b> <span>/month</span>
                        </div>
                    </div>
                </li>

                <li class="rounded-xl bg-white shadow p-4 min-w-xs justify-self-start">
                    <div class="flex justify-between items-center">
                        <label for="pro"
                            class="bg-pink-100 text-pink-800 font-semibold py-2 px-3 rounded-xl">Pro</label>
                        <input type="radio" name="plan" id="pro"
                            class="w-4 h-4 rounded-full border checked:bg-pink-800 appearance-none">
                    </div>

                    <div class="mt-6 mb-4">
                        <div class="text-lg">
                            <b class="font-bold text-4xl text-gray-800">100</b> <span>Credits</span>
                        </div>

                        <div class="my-4 text-lg">
                            <b class="font-bold text-2xl text-gray-800">$15</b> <span>/month</span>
                        </div>
                    </div>
                </li>
            </ul>

        </div>

    </main>

</body>

</html>
