<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="assets/imgs/Logo.png" type="image/png">
    <title>Content</title>
</head>

<body class="bg-gray-50 text-gray-600">

    <div class="container space-y-8 mx-auto my-4 px-4">

        <div class="bg-yellow-100 text-yellow-800 relative py-8 px-4 border rounded-lg">
            <h4
                class="bg-yellow-800 text-gray-50 absolute -top-4 left-4 flex justify-center items-center px-4 pt-1 pb-2 rounded-lg">
                Warning</h4>

            <p>Db error occurred.</p>
        </div>

        <div class="bg-red-100 text-red-800 relative py-8 px-4 border rounded-lg">
            <h4
                class="bg-red-800 text-gray-50 absolute -top-4 left-4 flex justify-center items-center px-4 pt-1 pb-2 rounded-lg">
                Error</h4>

            <p>Carousel adding failed.</p>
        </div>

        <div class="bg-blue-100 text-blue-800 relative py-8 px-4 border rounded-lg">
            <h4
                class="bg-blue-800 text-gray-50 absolute -top-4 left-4 flex justify-center items-center px-4 pt-1 pb-2 rounded-lg">
                Info</h4>

            <p>Carousel adding log successfully.</p>
        </div>

        <div class="bg-green-100 text-green-800 relative py-8 px-4 border rounded-lg">
            <h4
                class="bg-green-800 text-gray-50 absolute -top-4 left-4 flex justify-center items-center px-4 pt-1 pb-2 rounded-lg">
                Success</h4>

            <p>Carousel added successfully.</p>
        </div>

    </div>

</body>

</html>
