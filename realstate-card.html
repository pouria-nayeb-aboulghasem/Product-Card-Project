<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="assets/imgs/Logo.png" type="image/png">
    <title>RealState Card</title>
</head>

<body class="bg-gray-50 text-gray-700">

    <div class="container px-4 my-4 mx-auto">

        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-white -shadow shadow rounded-lg overflow-hidden">
                <!-- image -->
                <figure>
                    <img src="assets/imgs/real-state.jpg" alt="">
                </figure>

                <!-- info -->
                <div class="space-y-4 p-4">
                    <div class="flex justify-between">
                        <section class="space-y-1">
                            <h5 class="text-3xl font-bold">$3,273,279</h5>
                            <h6 class="text-xl font-bold">Luxury 5-bed Villa</h6>
                            <p class="text-gray-500">
                                <i class="ri-map-pin-2-line"></i>
                                29 terrace Rd. BH2 SEL
                            </p>
                        </section>

                        <span
                            class="bg-yellow-100 text-yellow-900 self-start px-3 py-1 rounded-full text-sm font-semibold">
                            For Sale
                        </span>
                    </div>

                    <!-- divider -->
                    <div class="w-full h-px bg-gray-200"></div>

                    <!-- details -->
                    <div>
                        <ul class="flex justify-between">
                            <li>
                                <i class="ri-ruler-line text-gray-500"></i>
                                <span class="font-bold">1634</span>
                                <span class="text-gray-500">sqft</span>
                            </li>

                            <li>
                                <i class="ri-hotel-bed-line text-gray-500"></i>
                                <span class="font-bold">5</span>
                                <span class="text-gray-500">bed</span>
                            </li>

                            <li>
                                <i class="ri-showers-line text-gray-500"></i>
                                <span class="font-bold">3</span>
                                <span class="text-gray-500">bath</span>
                            </li>
                        </ul>
                    </div>

                    <!-- divider -->
                    <div class="w-full h-px bg-gray-200"></div>

                    <!-- agent -->
                    <div class="flex items-center gap-4">
                        <figure>
                            <img src="assets/imgs/profile.jpg" alt="Jennifer Bloom" width="56" height="56"
                                class="rounded-full w-12 h-12 object-cover">
                        </figure>

                        <div>
                            <h6 class="font-bold">Jennifer Bloom</h6>
                            <a href="tel:+44235123321" class="text-sm text-gray-500">
                                +44 235 123 321
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
