<!DOCTYPE html>
<html lang="en-US" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="assets/imgs/Logo.png" type="image/png">
    <title>Fruits Category</title>
</head>

<body class="bg-gray-50 text-gray-600">

    <main class="container mx-auto my-4 px-4">
        <div class="mx-auto max-w-lg bg-white p-4 rounded-xl">
            <nav>
                <a href="#" class="font-bold text-lg">
                    <i class="ri-arrow-left-long-line"></i>
                </a>
            </nav>

            <section>
                <h1 class="my-6 text-2xl text-gray-800 font-bold">Categories</h1>

                <ul class="flex flex-col gap-4">
                    <li
                        class="grid grid-cols-4 justify-items-center items-center gap-2 bg-yellow-100 px-4 py-6 rounded-xl">
                        <figure class="col-span-1">
                            <img src="assets/imgs/banana-category.png" width="86" height="66" alt="">
                        </figure>

                        <div class="col-span-2 justify-self-start">
                            <h6 class="font-bold text-gray-800">Fresh fruits</h6>
                            <p>10 items</p>
                        </div>

                        <div class="col-span-1 justify-self-end">
                            <a href="#"
                                class="bg-gray-50 w-12 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition font-bold text-lg">
                                <i class="ri-arrow-right-line"></i>
                            </a>
                        </div>
                    </li>

                    <li
                        class="grid grid-cols-4 justify-items-center items-center gap-2 bg-teal-100 px-4 py-6 rounded-xl">
                        <figure class="col-span-1">
                            <img src="assets/imgs/cabbage-category.png" width="86" height="66" alt="">
                        </figure>

                        <div class="col-span-2 justify-self-start">
                            <h6 class="font-bold text-gray-800">Cruciferous vegetables</h6>
                            <p>5 items</p>
                        </div>

                        <div class="col-span-1 justify-self-end">
                            <a href="#"
                                class="bg-gray-50 w-12 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition font-bold text-lg">
                                <i class="ri-arrow-right-line"></i>
                            </a>
                        </div>
                    </li>

                    <li
                        class="grid grid-cols-4 justify-items-center items-center gap-2 bg-red-100 px-4 py-6 rounded-xl">
                        <figure class="col-span-1">
                            <img src="assets/imgs/watermelon-category.png" width="86" height="66" alt="">
                        </figure>

                        <div class="col-span-2 justify-self-start">
                            <h6 class="font-bold text-gray-800">Juicy melons</h6>
                            <p>7 items</p>
                        </div>

                        <div class="col-span-1 justify-self-end">
                            <a href="#"
                                class="bg-gray-50 w-12 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition font-bold text-lg">
                                <i class="ri-arrow-right-line"></i>
                            </a>
                        </div>
                    </li>

                    <li
                        class="grid grid-cols-4 justify-items-center items-center gap-2 bg-purple-100 px-4 py-6 rounded-xl">
                        <figure class="col-span-1">
                            <img src="assets/imgs/radish-category.png" width="86" height="66" alt="">
                        </figure>

                        <div class="col-span-2 justify-self-start">
                            <h6 class="font-bold text-gray-800">Root vegetables</h6>
                            <p>10 items</p>
                        </div>

                        <div class="col-span-1 justify-self-end">
                            <a href="#"
                                class="bg-gray-50 w-12 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition font-bold text-lg">
                                <i class="ri-arrow-right-line"></i>
                            </a>
                        </div>
                    </li>

                    <li
                        class="grid grid-cols-4 justify-items-center items-center gap-2 bg-green-100 px-4 py-6 rounded-xl">
                        <figure class="col-span-1">
                            <img src="assets/imgs/lettuce-category.png" width="86" height="66" alt="">
                        </figure>

                        <div class="col-span-2 justify-self-start">
                            <h6 class="font-bold text-gray-800">Fresh salads</h6>
                            <p>8 items</p>
                        </div>

                        <div class="col-span-1 justify-self-end">
                            <a href="#"
                                class="bg-gray-50 w-12 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition font-bold text-lg">
                                <i class="ri-arrow-right-line"></i>
                            </a>
                        </div>
                    </li>
                </ul>
            </section>
        </div>
    </main>

</body>

</html>
