<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="./assets/imgs/martini.png" type="image/png">
    <title>Cart</title>
</head>

<body class="bg-gray-50 text-gray-600">

    <main class="mx-auto container px-4 my-4">
        <div class="max-w-lg mx-auto bg-white px-4 py-12 rounded-xl">
            <div class="flex flex-col gap-2">
                <figure>
                    <img src="assets/imgs/cart.png" alt="" class="block mx-auto w-86 h-86 object-cover">
                </figure>

                <article class="space-y-2 text-center my-4">
                    <h1 class="text-4xl font-bold text-gray-800">
                        Your cart is empty
                    </h1>
                    <p>
                        Looks like you haven't added anything <wbr> to your cart yet.
                    </p>
                </article>

                <div class="flex justify-center">
                    <a href="/"
                        class="bg-blue-600 text-blue-100 font-semibold px-6 py-2 rounded-lg hover:opacity-75 transition duration-300">
                        Go shop
                    </a>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
